<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#000000" />
  <link rel="apple-touch-icon" href="icon.png" />
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-brand">Dashboard</span>
    <button class="btn btn-danger" onclick="logout()">Logout</button>
  </nav>

  <!-- Layout -->
  <div class="d-flex">
    <!-- Sidebar -->
    <div class="bg-secondary text-white p-3 vh-100" style="width: 250px;">
      <h4>Menu</h4>
      <ul class="nav flex-column">
        <li class="nav-item"><a href="timbrature.html" class="nav-link text-white">🕒 Timbrature</a></li>
        <li class="nav-item"><a href="lavoro.html" class="nav-link text-white">📝 Inserimento Lavoro</a></li>
        <li class="nav-item"><a href="esportazione.html" class="nav-link text-white">📤 Esportazione</a></li>
      </ul>
    </div>

    <!-- Contenuto principale -->
    <div class="container mt-4">
      <h2>Benvenuto nella Dashboard</h2>
      <p>Seleziona una sezione dal menu.</p>
    </div>
  </div>

  <!-- Script logout e Service Worker -->
  <script>
    function logout() {
      localStorage.removeItem("token");
      window.location.href = "index.html";
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js')
        .then(() => console.log("Service Worker registrato"))
        .catch(err => console.error("Errore SW:", err));
    }
  </script>

</body>
</html>
